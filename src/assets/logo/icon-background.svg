<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Android adaptive-icon BACKGROUND layer: full-bleed brand gradient (the launcher applies the shape). -->
  <defs>
    <linearGradient id="icon-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E88FF"/>
      <stop offset="1" stop-color="#7B61FF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#icon-bg)"/>
</svg>
